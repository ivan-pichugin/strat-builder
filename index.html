<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Strategy Builder</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: three zone rows (presets | live strategy) on the left, Backtest Results spanning the right column. */
:root{
  --bg:#eceff4; --panel:#ffffff; --panel-2:#f4f6fa; --fg:#151a24; --muted:#5b6579; --line:#d6dce6;
  --blue:#2f6fe4; --blue-ink:#1f57c2;
  --yellow:#e6b000; --yellow-ink:#7d5c00;
  --orange:#ec7a1c; --orange-ink:#b4510a;
  --green:#22b455; --green-ink:#127a3a;
  --good:#0f8a4b; --bad:#d6322f;
  --font-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --font-display:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1117; --panel:#161b24; --panel-2:#1d2430; --fg:#e8ebf2; --muted:#9aa4b6; --line:#2b3342;
    --blue:#5b8def; --blue-ink:#8fb2ff;
    --yellow:#f2c230; --yellow-ink:#f2c230;
    --orange:#f58a3a; --orange-ink:#ffa566;
    --green:#34c768; --green-ink:#4fdc82;
    --good:#3ddc84; --bad:#ff6b66;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1117; --panel:#161b24; --panel-2:#1d2430; --fg:#e8ebf2; --muted:#9aa4b6; --line:#2b3342;
  --blue:#5b8def; --blue-ink:#8fb2ff;
  --yellow:#f2c230; --yellow-ink:#f2c230;
  --orange:#f58a3a; --orange-ink:#ffa566;
  --green:#34c768; --green-ink:#4fdc82;
  --good:#3ddc84; --bad:#ff6b66;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--bg); color:var(--fg); font-family:var(--font-ui); font-size:12.5px; line-height:1.35;
  height:100dvh; overflow:hidden; display:flex; flex-direction:column;
  padding-block:8px 8px;
  padding-left:max(10px, env(safe-area-inset-left, 0px));
  padding-right:max(10px, env(safe-area-inset-right, 0px));
}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px}

.app{max-width:1360px;margin:0 auto;width:100%;height:100%;display:flex;flex-direction:column;min-height:0}
.top{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 20px;margin-bottom:6px;flex:none}
.top h1{font-family:var(--font-mono);font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0}
.top p{margin:0;color:var(--muted);font-size:12.5px}

.grid{
  display:grid;gap:8px;flex:1;min-height:0;
  grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.12fr);
  grid-template-rows:auto repeat(3,minmax(0,1fr));
  align-items:stretch;
}
.results{grid-column:3;grid-row:1 / span 4}
.box{height:100%;min-height:0}
.box .pool{overflow:auto;min-height:0}
.res-body{overflow:auto;min-height:0}

.zone-market{--c:var(--blue);--ink:var(--blue-ink)}
.zone-indicators{--c:var(--yellow);--ink:var(--yellow-ink)}
.zone-parameters{--c:var(--orange);--ink:var(--orange-ink)}
.zone-results{--c:var(--green);--ink:var(--green-ink)}

.box{
  background:var(--panel); border:2px solid var(--c); border-radius:6px;
  padding:9px; min-width:0; display:flex; flex-direction:column; gap:6px;
}
.box-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.box-head h2{font-family:var(--font-mono);font-size:14px;font-weight:700;color:var(--ink);margin:0;letter-spacing:-.01em}
.kicker{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.add{
  width:22px;height:22px;border-radius:4px;border:2px solid var(--c);background:transparent;color:var(--ink);
  font-family:var(--font-mono);font-size:15px;line-height:1;display:grid;place-items:center;padding:0;flex:none;
}
.add:hover{background:var(--c);color:var(--panel)}

.pool{display:flex;flex-wrap:wrap;gap:5px;align-content:start;justify-content:start}
.pool .empty{flex:1 1 100%}
.box[data-drop]{transition:background .15s,box-shadow .15s}
.box.over{background:color-mix(in srgb,var(--c) 9%,var(--panel));box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 38%,transparent)}
.box.bad{box-shadow:0 0 0 3px color-mix(in srgb,var(--bad) 45%,transparent)}
.tile{
  width:122px;height:40px;overflow:hidden;display:flex;flex-direction:column;justify-content:center;gap:1px;padding:5px 8px;
  border:2px solid var(--line);border-radius:5px;background:var(--panel-2);
  cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;text-align:left;
}
.tile:hover{border-color:var(--c)}
.tile.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 13%,var(--panel))}
.tile .nm{font-weight:600;font-size:10.5px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:14px}
.tile .ds{font-size:9px;line-height:1.2;color:var(--muted);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tile .val{margin-top:0}
.tile .val input{width:44px;padding:2px 4px}
.tile.dragging{opacity:.5;border:2px dashed var(--c);background:var(--panel-2)}
.tile.flash{animation:flash 1.4s ease-out}
.ghost{position:fixed!important;z-index:2147483647!important;top:0;left:0;pointer-events:none!important;box-shadow:0 16px 34px rgba(0,0,0,.5);transform:rotate(-3deg) scale(1.08);opacity:1!important;margin:0!important;cursor:grabbing}
body.is-dragging,body.is-dragging *{cursor:grabbing!important;user-select:none;-webkit-user-select:none}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes flash{from{background:color-mix(in srgb,var(--c) 35%,var(--panel))}}

.score{display:flex;align-items:center;gap:10px}
.track{flex:1;height:6px;background:var(--panel-2);border:1px solid var(--line);border-radius:3px;overflow:hidden}
.fill{height:100%;background:var(--c);transition:width .5s ease}
.score b{font-family:var(--font-mono);font-size:10px;font-weight:500;white-space:nowrap}
.note{margin:0;font-size:10px;color:var(--muted)}

.val{display:flex;align-items:center;gap:3px;font-family:var(--font-mono);font-size:10px;color:var(--muted)}
.val input{
  width:58px;background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:3px 6px;
  font-family:var(--font-mono);font-size:13px;text-align:right;
}
.empty{border:1px dashed var(--line);border-radius:4px;padding:8px;color:var(--muted);font-size:10.5px;text-align:center}


/* Library column (quiet) and strategy column (main) */
.colhead{min-width:0;align-self:end;padding:0 2px 2px}
.lib-head{font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.strat-head h2{margin:0;font-family:var(--font-display);font-weight:700;font-size:18px;line-height:1.1;letter-spacing:-.01em}
.stripe{display:flex;gap:3px;height:6px;margin:10px 0 8px}
.stripe i{flex:1;border-radius:1px}
.stripe i:nth-child(1){background:var(--blue)}
.stripe i:nth-child(2){background:var(--yellow)}
.stripe i:nth-child(3){background:var(--orange)}
.strat-head p{margin:0;font-family:var(--font-mono);font-size:9.5px;color:var(--muted)}

.box.lib{background:color-mix(in srgb,var(--c) 7%,var(--panel-2));border:2px solid color-mix(in srgb,var(--c) 35%,var(--line));border-radius:6px;padding:10px 10px 12px}
.lib .box-head h2{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink)}
.lib .box-head h2::before{content:"";display:inline-block;width:8px;height:8px;background:var(--c);margin-right:8px;border-radius:1px}
.lib .kicker{color:var(--ink);opacity:.75}
.lib .add{width:24px;height:24px;border-width:2px;border-color:var(--c);color:var(--ink);font-size:15px}
.lib .add:hover{background:var(--c);color:var(--panel)}
.lib .pool{gap:5px}
.lib .tile{width:104px;height:34px;padding:4px 7px;background:var(--panel);border:1px solid color-mix(in srgb,var(--c) 30%,var(--line))}
.lib .tile:hover{border-color:var(--c);box-shadow:0 0 0 1px var(--c)}
.lib .tile .nm{font-size:10px;font-weight:500}
.lib .tile .ds{font-size:9px}
.lib .empty{font-size:10.5px;padding:7px}
.box.lib.over{border-color:var(--c);border-style:solid;box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 30%,transparent)}

.box.strat{padding:16px;gap:12px}
.strat .box-head h2.zchip{display:inline-block;font-family:var(--font-mono);font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:var(--c);color:#0b0e14;padding:2px 7px;border-radius:3px}
.strat .kicker{margin-top:6px}
.strat .tile.on{background:color-mix(in srgb,var(--c) 20%,var(--panel))}

.tile{position:relative}
.tile .nm{padding-right:14px}
.tile .del{
  position:absolute;top:3px;right:3px;width:14px;height:14px;padding:0;border:0;border-radius:3px;
  background:var(--panel);color:var(--muted);font-size:11px;line-height:1;display:grid;place-items:center;
  opacity:0;transition:opacity .12s;
}
.tile .info{
  position:absolute;bottom:3px;right:3px;width:14px;height:14px;border-radius:50%;border:1px solid var(--line);
  background:var(--panel);color:var(--muted);font:italic 600 9px/1 var(--font-mono);padding:0;
  display:grid;place-items:center;opacity:0;transition:opacity .12s;
}
.tile:hover .del,.tile:focus-within .del,.tile .del:focus-visible,
.tile:hover .info,.tile:focus-within .info,.tile .info:focus-visible{opacity:1}
.tile .del:hover{color:var(--bad);background:color-mix(in srgb,var(--bad) 16%,var(--panel))}
.tile .info:hover,.tile .info[aria-expanded="true"]{border-color:var(--c);color:var(--ink);opacity:1}
.tile .info-pop{left:0;right:0;bottom:calc(100% + 6px)}
.ghost{background:var(--panel)!important;border:2px solid var(--c)!important;opacity:1!important}
.ghost .del,.ghost .info{display:none}
@media (hover:none){.tile .del,.tile .info{opacity:.8}}

.reshead{font-family:var(--font-display);font-weight:700;font-size:14px;line-height:1.2;color:var(--ink);margin:0}
.ins{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.ins li{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:8px;padding:6px 8px;background:var(--panel-2);border:1px solid var(--line);border-left:3px solid var(--good);border-radius:4px}
.ins li.neg{border-left-color:var(--bad)}
.ins .tg{grid-column:1;font-family:var(--font-mono);font-size:8.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.ins .tt{grid-column:1;font-weight:600;font-size:11px}
.ins .dt{grid-column:1;font-size:10px;color:var(--muted)}
.ins .ed{grid-column:2;grid-row:1 / span 3;align-self:center;font-family:var(--font-mono);font-size:10.5px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--good);text-align:right}
.ins li.neg .ed{color:var(--bad)}
.sub-note{margin:0;font-size:9.5px;color:var(--muted)}

/* Results */
.res-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.chips{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pill{font-family:var(--font-mono);font-size:9.5px;border:1px solid var(--line);border-radius:3px;padding:1px 6px;color:var(--muted);white-space:nowrap}
.pill.ver{color:var(--ink);border-color:var(--c)}
.pill.good{color:var(--good);border-color:var(--good)}
.pill.bad{color:var(--bad);border-color:var(--bad)}
.pill.mixed{color:var(--fg)}
.busytag{display:none;align-items:center;gap:6px;font-family:var(--font-mono);font-size:11px;color:var(--muted)}
.busytag i{width:8px;height:8px;border-radius:50%;background:var(--c);animation:pulse .8s ease-in-out infinite alternate}
@keyframes pulse{from{opacity:.25}to{opacity:1}}
.results.busy .busytag{display:inline-flex}
.res-body{display:flex;flex-direction:column;gap:9px;transition:opacity .25s}
.results.busy .res-body{opacity:.4}

.hero{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px}
.hero .big{font-family:var(--font-mono);font-size:26px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums;line-height:1}
.hero .sub{color:var(--muted);font-size:10px}
.up{color:var(--good)} .down{color:var(--bad)}
.delta{font-family:var(--font-mono);font-size:12px;font-variant-numeric:tabular-nums}

.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:10px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:18px;height:0;border-top:2.5px solid var(--good)}
.legend i.dash{border-top:2px dashed var(--muted)}
.chart{width:100%;height:auto;display:block;max-width:100%}
.chart text{font-family:var(--font-mono);font-size:10.5px;fill:var(--muted)}

.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:6px}
.metric{
  position:relative;background:var(--panel-2);border:1px solid var(--line);border-radius:6px;
  padding:7px 9px 8px;display:flex;flex-direction:column;gap:3px;
}
.metric-top{display:flex;align-items:center;justify-content:space-between;gap:6px}
.metric .lb{font-size:9.5px;color:var(--muted);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.metric .v{font-family:var(--font-mono);font-size:17px;font-weight:600;line-height:1.15;font-variant-numeric:tabular-nums}
.metric .delta{display:block}
.info{
  flex:none;width:14px;height:14px;border-radius:50%;border:1px solid var(--line);background:var(--panel);
  color:var(--muted);font:italic 600 9px/1 var(--font-mono);padding:0;display:grid;place-items:center;
}
.info:hover,.info[aria-expanded="true"]{border-color:var(--c);color:var(--ink)}
.info-pop{
  position:absolute;left:8px;right:8px;bottom:calc(100% + 6px);z-index:50;
  background:var(--fg);color:var(--bg);font-size:10px;line-height:1.35;border-radius:5px;
  padding:7px 9px;box-shadow:0 8px 20px rgba(0,0,0,.25);
}
.info-pop::after{content:"";position:absolute;top:100%;left:14px;border:5px solid transparent;border-top-color:var(--fg)}

.assess{border-top:2px solid var(--c);padding-top:7px;display:flex;flex-direction:column;gap:6px}
.assess h3{margin:0;font-family:var(--font-mono);font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);font-weight:700}
.cmp{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:7px}
.cmp h4{margin:0 0 4px;font-size:12px;font-family:var(--font-mono);font-weight:500}
.cmp ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px}
.cmp li{font-size:10.5px;padding-left:10px;position:relative}
.cmp li::before{content:"";position:absolute;left:0;top:.55em;width:5px;height:5px;border-radius:50%;background:currentColor}
.cmp .b h4,.cmp .b li::before{color:var(--good)}
.cmp .w h4,.cmp .w li::before{color:var(--bad)}
.cmp li span{color:var(--fg)}
.cmp .none{color:var(--muted);font-size:13px}
.comment{margin:0;background:var(--panel-2);border:1px solid var(--line);border-radius:4px;padding:6px 8px;font-size:10.5px}

.hist{display:flex;align-items:flex-end;gap:4px;height:44px}
.hist div{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px;height:100%}
.hist .bar{width:100%;border-radius:2px 2px 0 0;background:var(--good);min-height:3px}
.hist .bar.neg{background:var(--bad)}
.hist small{font-family:var(--font-mono);font-size:10px;color:var(--muted)}
.hist .cur small{color:var(--fg);font-weight:700}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(8,10,16,.55);display:grid;place-items:center;padding:16px;z-index:20}
.modal{
  background:var(--panel);border:2px solid var(--c);border-radius:6px;width:min(480px,100%);
  padding:18px;display:flex;flex-direction:column;gap:12px;max-height:100%;overflow:auto;
}
.modal h3{margin:0;font-family:var(--font-mono);font-size:18px;color:var(--ink)}
.modal label{display:flex;flex-direction:column;gap:5px;font-weight:500;font-size:13px}
.modal label small{font-weight:400;color:var(--muted);font-size:12px}
.modal input[type=text],.modal textarea{
  background:var(--panel-2);border:1px solid var(--line);border-radius:4px;padding:8px 10px;width:100%;font-weight:400
}
.modal textarea{min-height:96px;resize:vertical}
.modal input:focus,.modal textarea:focus{outline:2px solid var(--c);outline-offset:0;border-color:var(--c)}
.err{color:var(--bad);font-size:12px;min-height:1em;margin:0}
.actions{display:flex;justify-content:flex-end;gap:8px}
.btn{border:1px solid var(--line);background:var(--panel-2);border-radius:4px;padding:8px 14px;font-weight:500}
.btn.primary{background:var(--c);border-color:var(--c);color:#0b0e14}
.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom, 0px));
  background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:4px;font-size:13px;z-index:30;max-width:calc(100% - 32px)
}

/* ---- Larger sizing overrides ---- */
body{font-size:14.5px}
.top h1{font-size:14px}
.top p{font-size:14px}
.box{padding:12px;gap:8px}
.box-head h2{font-size:16px}
.kicker{font-size:11px}
.add,.lib .add{width:30px;height:30px;font-size:19px}
.pool,.lib .pool{gap:7px}
.tile{width:150px;height:52px;padding:6px 10px;overflow:visible}
.tile .nm{font-size:13px;padding-right:22px}
.tile .ds{font-size:11px}
.tile .val{font-size:12px}
.tile .val input{width:56px;font-size:14px;padding:3px 5px}
.lib .tile{width:134px;height:46px;padding:5px 9px}
.lib .tile .nm{font-size:12.5px}
.lib .tile .ds{font-size:11px}
.empty,.lib .empty{font-size:12.5px;padding:10px}
.lib-head{font-size:13px}
.strat-head h2{font-size:22px}
.strat-head p{font-size:11.5px}
.lib .box-head h2{font-size:12.5px}
.lib .box-head h2::before{width:10px;height:10px}
.strat .box-head h2.zchip{font-size:11.5px;padding:3px 9px}
.box.strat{padding:18px}
.tile .del{width:18px;height:18px;font-size:14px;top:4px;right:4px}
.tile .info{width:20px;height:20px;font-size:12px;bottom:4px;right:4px;opacity:.75}
.info{width:20px;height:20px;font-size:12px}
.info-pop{font-size:12.5px;line-height:1.4;padding:9px 11px}
.tile .info-pop{position:fixed;left:auto;right:auto;bottom:auto;width:230px;max-width:calc(100vw - 16px);z-index:2147483000;pointer-events:none}
.tile .info-pop::after{display:none}
.reshead{font-size:17px}
.pill{font-size:11.5px;padding:2px 8px}
.busytag{font-size:12.5px}
.hero .big{font-size:32px}
.hero .sub{font-size:12px}
.delta{font-size:13.5px}
.legend{font-size:12px}
.chart text{font-size:11.5px}
.metrics{grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:8px}
.metric{padding:9px 11px 10px}
.metric .lb{font-size:11.5px}
.metric .v{font-size:20px}
.assess h3{font-size:14.5px}
.cmp h4{font-size:13.5px}
.cmp li{font-size:12.5px}
.comment{font-size:12.5px;padding:8px 10px}

<div class="app">
  <header class="top">
    <h1>Strategy Builder</h1>
    <p>Drag a tile from a preset box into its strategy box. Backtest window: 12 months to 4 Nov 2026. Results are random demo data.</p>
  </header>

  <main class="grid" id="grid">
    <div class="colhead lib-head">Preset library</div>
    <div class="colhead strat-head" id="stratHead"></div>
    <!-- zone rows are rendered by script -->
    <section class="box results zone-results" id="results" aria-label="Backtest Results">
      <div class="res-head">
        <h2 class="reshead">Backtest Results</h2>
        <div class="chips">
          <span class="busytag" aria-hidden="true"><i></i>Rebuilding</span>
          <span class="pill ver" id="verPill">v1</span>
          <span class="pill" id="verdict">Baseline</span>
        </div>
      </div>
      <div class="res-body" id="resBody"></div>
    </section>
  </main>
</div>

<div class="overlay" id="overlay" hidden>
  <form class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle" novalidate>
    <h3 id="mTitle">New indicator</h3>
    <label for="mName">Name
      <input type="text" id="mName" autocomplete="off" maxlength="60" placeholder="e.g. Stochastic RSI">
    </label>
    <label for="mDesc">Tell the AI assistant what it is
      <textarea id="mDesc" placeholder="e.g. Buy when the oscillator crosses above 20 and the price is above the 50-day average."></textarea>
      <small>The assistant reads this to understand the rule and include it in the backtest.</small>
    </label>
    <p class="err" id="mErr" role="alert"></p>
    <div class="actions">
      <button type="button" class="btn" id="mCancel">Cancel</button>
      <button type="submit" class="btn primary">Add to presets</button>
    </div>
  </form>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(function(){
  var ZONES=[
    {id:'market',name:'Market Layer',cls:'zone-market',noun:'market rule',hint:'Where and when the strategy trades'},
    {id:'indicators',name:'Indicators',cls:'zone-indicators',noun:'indicator',hint:'Signals that trigger entries and exits'},
    {id:'parameters',name:'Parameters',cls:'zone-parameters',noun:'parameter',hint:'Risk and sizing rules'}
  ];
  var PRESETS={
    market:[
      {id:'m1',name:'BTC/USDT spot',desc:'Bitcoin against Tether on the spot market'},
      {id:'m2',name:'ETH/USDT spot',desc:'Ether against Tether on the spot market'},
      {id:'m5',name:'Timeframe 1H',desc:'One-hour candles'},
      {id:'m6',name:'Timeframe 4H',desc:'Four-hour candles'},
      {id:'m8',name:'Bull regime only',desc:'Trade only while price is above the 200-day average'}
    ],
    indicators:[
      {id:'i1',name:'SMA 50/200 cross',desc:'Buy when the 50 crosses above the 200'},
      {id:'i2',name:'RSI(14) below 30',desc:'Oversold entry, exit above 55'},
      {id:'i3',name:'MACD signal cross',desc:'Momentum shift on 12/26/9 settings'},
      {id:'i5',name:'ATR(14) volatility filter',desc:'Skip trades when volatility is extreme'}
    ],
    parameters:[
      {id:'p1',name:'Stop loss',desc:'Exit when a trade loses this much',val:2,unit:'%'},
      {id:'p2',name:'Take profit',desc:'Exit when a trade gains this much',val:4,unit:'%'},
      {id:'p3',name:'Position size',desc:'Share of equity per trade',val:5,unit:'%'},
      {id:'p6',name:'Trailing stop',desc:'Follows price to lock in gains',val:1.5,unit:'%'}
    ]
  };
  var active={market:['m1','m6'],indicators:['i1','i2'],parameters:['p1','p2','p3']};
  var values={};
  Object.keys(PRESETS).forEach(function(z){PRESETS[z].forEach(function(p){if(p.val!==undefined)values[p.id]=p.val;});});
  var scores={market:0,indicators:0,parameters:0};
  var customCount=0;
  var versions=[];
  var reason='Baseline';
  var pending=null;
  var lastAdded=null;

  function $(s,r){return (r||document).querySelector(s);}
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function rnd(a,b){return a+Math.random()*(b-a);}
  function find(z,id){return PRESETS[z].filter(function(p){return p.id===id;})[0];}

  /* ---------- Build zone rows ---------- */
  var grid=$('#grid'), resultsEl=$('#results');
  ZONES.forEach(function(z){
    var a=document.createElement('section');
    a.className='box lib '+z.cls; a.id='presets-'+z.id; a.setAttribute('aria-label',z.name+' presets');
    var b=document.createElement('section');
    b.className='box strat '+z.cls; b.id='strategy-'+z.id; b.setAttribute('aria-label',z.name+' strategy');
    a.setAttribute('data-drop','presets');a.setAttribute('data-z',z.id);
    b.setAttribute('data-drop','strategy');b.setAttribute('data-z',z.id);
    grid.insertBefore(a,resultsEl); grid.insertBefore(b,resultsEl);
  });

  function tileHtml(z,p,on,flash){
    var h='<div class="tile'+(on?' on':'')+(flash?' flash':'')+'" role="button" tabindex="0" data-z="'+z+'" data-id="'+p.id+'" title="'+esc(p.desc)+'" aria-label="'+esc(p.name)+'. '+(on?'In the strategy. Press Enter to move it back to presets.':'In presets. Press Enter to add it to the strategy.')+'">';
    h+='<span class="nm">'+esc(p.name)+'</span>';
    h+='<button type="button" class="del" tabindex="-1" aria-label="Delete '+esc(p.name)+'">×</button>';
    h+='<button type="button" class="info" data-tile-info="'+p.id+'" tabindex="-1" aria-label="What is '+esc(p.name)+'?" aria-expanded="false">i</button>';
    if(on&&p.val!==undefined){
      h+='<span class="val"><input type="number" step="any" min="0" id="v-'+p.id+'" data-val="'+p.id+'" value="'+values[p.id]+'" aria-label="'+esc(p.name)+' value">'+(p.unit?'<span>'+p.unit+'</span>':'')+'</span>';
    } else {
      h+='<span class="ds">'+esc(p.desc)+'</span>';
    }
    h+='<div class="info-pop" id="tile-pop-'+p.id+'" role="tooltip" hidden>'+esc(p.desc)+'</div>';
    return h+'</div>';
  }

  function renderPresets(){
    ZONES.forEach(function(z){
      var el=$('#presets-'+z.id);
      var free=PRESETS[z.id].filter(function(p){return active[z.id].indexOf(p.id)<0;});
      var html='<div class="box-head"><div><h2>'+z.name+'</h2><div class="kicker">Presets · '+free.length+' available</div></div>'+
        '<button class="add" type="button" data-add="'+z.id+'" aria-label="Add a '+z.noun+'">+</button></div><div class="pool">';
      if(!free.length)html+='<div class="empty">Everything is in the strategy. Drag a tile back here to take it out.</div>';
      free.forEach(function(p){html+=tileHtml(z.id,p,false,lastAdded===p.id);});
      html+='</div>';
      el.innerHTML=html;
    });
    lastAdded=null;
  }

  var NOTES={
    market:{hi:'Clear scope. Signals should be easy to read on this market.',lo:'Scope is loose. Narrow the market or timeframe.',none:'Pick a market and a timeframe to start.'},
    indicators:{hi:'Entries and exits are well covered by these signals.',lo:'Signals may overlap or conflict. Test them one at a time.',none:'Add at least one signal that triggers a trade.'},
    parameters:{hi:'Risk limits are balanced against the expected reward.',lo:'Risk limits look thin. Check stop loss and position size.',none:'Add a stop loss and a position size.'}
  };
  function scoreLabel(s){return s>=80?'Strong':s>=65?'Solid':'Needs work';}

  function renderStratHead(){
    var rules=0,sum=0,n=0;
    ZONES.forEach(function(z){rules+=active[z.id].length;if(scores[z.id]){sum+=scores[z.id];n++;}});
    $('#stratHead').innerHTML='<h2>Strategy</h2><div class="stripe"><i></i><i></i><i></i></div><p>'+rules+(rules===1?' rule':' rules')+' active · '+(n?'overall '+Math.round(sum/n)+'/100':'not assessed yet')+'</p>';
  }

  function renderStrategy(){
    renderStratHead();
    ZONES.forEach(function(z){
      var el=$('#strategy-'+z.id), list=active[z.id], sc=scores[z.id];
      var html='<div class="box-head"><div><h2 class="zchip">'+z.name+'</h2><div class="kicker">Strategy · '+list.length+' active</div></div></div>';
      html+='<div class="score"><div class="track" role="img" aria-label="Assessment '+sc+' out of 100"><div class="fill" style="width:'+sc+'%"></div></div><b>'+(list.length?scoreLabel(sc)+' '+sc:'No rules')+'</b></div>';
      html+='<p class="note">'+(list.length?(sc>=70?NOTES[z.id].hi:NOTES[z.id].lo):NOTES[z.id].none)+'</p>';
      html+='<div class="pool">';
      if(!list.length)html+='<div class="empty">Nothing active. Drag a tile here from the presets.</div>';
      list.forEach(function(id){var p=find(z.id,id);if(p)html+=tileHtml(z.id,p,true,false);});
      html+='</div>';
      el.innerHTML=html;
    });
  }

  /* ---------- Backtest ---------- */
  function makeResult(){
    var ret=rnd(-9,52), n=60, vol=rnd(1.2,3.2), steps=[], cum=[0], i;
    for(i=0;i<n;i++){steps.push((Math.random()+Math.random()+Math.random()-1.5)*2);cum.push(cum[cum.length-1]+steps[i]);}
    var curve=[];
    for(i=0;i<=n;i++){
      var y=100+ret*(i/n)+(cum[i]-cum[n]*i/n)*vol;
      curve.push(Math.max(60,y));
    }
    curve[n]=Math.max(60,100+ret);
    return {ret:ret,sharpe:rnd(0.2,2.7),dd:rnd(5,29),win:rnd(36,70),pf:rnd(0.75,2.5),trades:Math.round(rnd(38,260)),curve:curve,reason:reason,insights:makeInsights()};
  }
  function names(z){return active[z].map(function(id){return find(z,id).name;});}
  function makeInsights(){
    var r=function(a,b){return Math.round(rnd(a,b));};
    var f=function(a,b,d){return rnd(a,b).toFixed(d===undefined?1:d);};
    var ind=names('indicators'), par=names('parameters');
    var pos=[
      function(){var a=r(58,72),b=r(35,50);return {tag:'Market regime',title:'Works better in bull markets',detail:'Win rate '+a+'% above the 200-day average, '+b+'% below it.',edge:'+'+(a-b)+' pts'};},
      function(){return {tag:'Time of day',title:'Works better in late evenings',detail:r(55,74)+'% of net profit came from trades opened between 18:00 and 23:00.',edge:'+'+r(14,31)+' pts'};},
      function(){var a=rnd(0.35,0.8),b=rnd(-0.1,0.25);return {tag:'Day of week',title:'Strongest from Tuesday to Thursday',detail:'Average trade '+a.toFixed(2)+'% on those days, '+b.toFixed(2)+'% on the other four.',edge:'+'+(a-b).toFixed(2)+'%'};},
      function(){var x=rnd(1.4,2.6);return {tag:'Holding time',title:'Short trades pay best',detail:'Trades closed within 6 hours earn '+x.toFixed(1)+'x more per trade than longer ones.',edge:'+'+x.toFixed(1)+'x'};},
      function(){var has=ind.some(function(n){return /ATR/.test(n);});return {tag:'Volatility',title:has?'The volatility filter is working':'Calm markets suit it',detail:has?'Skipping extreme-volatility days removed '+r(18,34)+'% of the losing trades.':'Win rate '+r(58,70)+'% when volatility is below its 30-day median.',edge:'+'+r(6,16)+' pts'};}
    ];
    var neg=[
      function(){var a=rnd(0.2,0.7),b=rnd(0.05,0.3);return {tag:'Economic events',title:'Worse results on economic event days',detail:'Average trade -'+a.toFixed(2)+'% on FOMC, CPI and jobs-report days, +'+b.toFixed(2)+'% on all other days.',edge:'-'+r(9,22)+' pts'};},
      function(){var a=r(30,41);return {tag:'Volatility',title:'Struggles when volatility spikes',detail:'In the most volatile 10% of days the win rate falls to '+a+'%.',edge:'-'+r(12,24)+' pts'};},
      function(){return {tag:'Day of week',title:'Weekends lose money',detail:'Saturday and Sunday trades return -'+f(0.1,0.5,2)+'% each on thin liquidity.',edge:'-'+f(0.2,0.7,2)+'%'};},
      function(){return {tag:'Fills',title:'Monday gaps hurt',detail:'Stops filled '+f(0.2,0.9)+'% worse than planned after weekend gaps.',edge:'-'+f(0.1,0.5,2)+'%'};},
      function(){if(par.indexOf('Stop loss')<0)return null;var x=r(26,48);return {tag:'Risk',title:'The stop loss may be too tight',detail:x+'% of stopped-out trades recovered within 4 hours.',edge:'-'+x+'% missed'};},
      function(){if(ind.length<2)return null;var x=r(52,81);return {tag:'Signals',title:'Two signals overlap',detail:ind[0]+' and '+ind[1]+' fire together on '+x+'% of entries, so the second adds little.',edge:x+'%'};}
    ];
    function pick(list,n,sign){
      var out=[];
      list.slice().sort(function(){return Math.random()-.5;}).forEach(function(fn){
        if(out.length>=n)return;
        var v=fn(); if(v){v.neg=!sign;out.push(v);}
      });
      return out;
    }
    var all=pick(pos,3,true).concat(pick(neg,2,false));
    return all.sort(function(){return Math.random()-.5;});
  }

  var METRICS=[
    {k:'ret',label:'Net return',up:true,f:function(v){return (v>=0?'+':'−')+Math.abs(v).toFixed(1)+'%';},desc:'Total profit or loss over the 12-month window, as a percent of starting equity.'},
    {k:'sharpe',label:'Sharpe ratio',up:true,f:function(v){return v.toFixed(2);},desc:'Return earned per unit of volatility. Above 1 is decent, above 2 is strong.'},
    {k:'dd',label:'Max drawdown',up:false,f:function(v){return '−'+v.toFixed(1)+'%';},desc:'The largest drop from a peak to a low point in equity. Smaller is safer.'},
    {k:'win',label:'Win rate',up:true,f:function(v){return v.toFixed(0)+'%';},desc:'Share of trades that closed with a profit, regardless of size.'},
    {k:'pf',label:'Profit factor',up:true,f:function(v){return v.toFixed(2);},desc:'Gross profit divided by gross loss. Above 1 means winners outweigh losers.'}
  ];
  function deltaStr(m,cur,prev){
    var d=cur-prev; var sign=d>=0?'+':'−';
    var abs=Math.abs(d);
    var txt=(m.k==='ret'||m.k==='dd'||m.k==='win')?abs.toFixed(m.k==='win'?0:1)+' pts':abs.toFixed(2);
    var good=m.up?d>=0:d<=0;
    return '<span class="delta '+(good?'up':'down')+'">'+(d>=0?'▲':'▼')+' '+sign+txt+' vs v'+(versions.length-1)+'</span>';
  }

  function chartSvg(cur,prev){
    var W=640,H=150,L=40,R=14,T=10,B=22,pw=W-L-R,ph=H-T-B;
    var all=cur.concat(prev||[]);
    var mn=Math.min.apply(null,all),mx=Math.max.apply(null,all);
    var pad=(mx-mn)*.1||5; mn=Math.floor((mn-pad)/5)*5; mx=Math.ceil((mx+pad)/5)*5;
    function X(i){return L+pw*i/(cur.length-1);}
    function Y(v){return T+ph*(1-(v-mn)/(mx-mn));}
    function path(a){return a.map(function(v,i){return (i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1);}).join('');}
    var s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Equity curve, start value 100, ending at '+cur[cur.length-1].toFixed(1)+'">';
    s+='<defs><linearGradient id="eqg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" style="stop-color:var(--good);stop-opacity:.28"/><stop offset="100%" style="stop-color:var(--good);stop-opacity:0"/></linearGradient></defs>';
    var ticks=4;
    for(var t=0;t<=ticks;t++){
      var v=mn+(mx-mn)*t/ticks, y=Y(v);
      s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y.toFixed(1)+'" y2="'+y.toFixed(1)+'" style="stroke:var(--line)" stroke-width="1" fill="none"/>';
      s+='<text x="'+(L-6)+'" y="'+(y+3.5).toFixed(1)+'" text-anchor="end">'+Math.round(v)+'</text>';
    }
    if(100>mn&&100<mx){
      s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(100).toFixed(1)+'" y2="'+Y(100).toFixed(1)+'" style="stroke:var(--muted)" stroke-width="1" stroke-dasharray="2 4" fill="none"/>';
    }
    var labels=["Nov '25","Feb '26","May '26","Aug '26","Nov '26"];
    labels.forEach(function(l,i){
      var x=L+pw*i/4;
      s+='<text x="'+x.toFixed(1)+'" y="'+(H-7)+'" text-anchor="'+(i===0?'start':i===4?'end':'middle')+'">'+l+'</text>';
    });
    if(prev) s+='<path d="'+path(prev)+'" style="stroke:var(--muted)" stroke-width="1.6" stroke-dasharray="5 4" fill="none"/>';
    s+='<path d="'+path(cur)+'L'+X(cur.length-1).toFixed(1)+' '+(T+ph)+'L'+L+' '+(T+ph)+'Z" fill="url(#eqg)" stroke="none"/>';
    s+='<path d="'+path(cur)+'" style="stroke:var(--good)" stroke-width="2.4" stroke-linejoin="round" fill="none"/>';
    var ex=X(cur.length-1), ey=Y(cur[cur.length-1]);
    s+='<circle cx="'+ex.toFixed(1)+'" cy="'+ey.toFixed(1)+'" r="4.5" style="fill:var(--panel);stroke:var(--good)" stroke-width="2.4"/>';
    s+='</svg>';
    return s;
  }

  function renderResults(){
    var cur=versions[versions.length-1], prev=versions.length>1?versions[versions.length-2]:null, v=versions.length;
    $('#verPill').textContent='v'+v;
    var better=[],worse=[];
    var html='';

    html+='<div><div class="kicker">Net return, 12 months</div><div class="hero"><span class="big '+(cur.ret>=0?'up':'down')+'">'+METRICS[0].f(cur.ret)+'</span>'+
      (prev?deltaStr(METRICS[0],cur.ret,prev.ret):'<span class="sub">Baseline version</span>')+
      '<span class="sub">'+cur.trades+' trades</span></div></div>';

    html+='<div><div class="legend" style="margin-bottom:6px"><span><i></i>v'+v+' equity (start = 100)</span>'+(prev?'<span><i class="dash"></i>v'+(v-1)+'</span>':'')+'</div>'+chartSvg(cur.curve,prev?prev.curve:null)+'</div>';

    html+='<div class="metrics">';
    METRICS.slice(1).forEach(function(m){
      html+='<div class="metric"><div class="metric-top"><span class="lb">'+m.label+'</span>'+
        '<button type="button" class="info" data-info="'+m.k+'" aria-label="What is '+esc(m.label)+'?" aria-expanded="false">i</button></div>'+
        '<span class="v">'+m.f(cur[m.k])+'</span>'+(prev?deltaStr(m,cur[m.k],prev[m.k]):'<span class="delta" style="color:var(--muted)">Baseline</span>')+
        '<div class="info-pop" id="pop-'+m.k+'" role="tooltip" hidden>'+esc(m.desc)+'</div></div>';
    });
    html+='</div>';

    var verdict='Baseline', vcls='';
    var tip='This is the first run. Change a rule on the left and the next version will be compared against it.';
    var bl='',wl='';
    if(prev){
      var TXT={
        ret:{b:function(a,b){return 'Net return rose from '+METRICS[0].f(a)+' to '+METRICS[0].f(b)+'.';},w:function(a,b){return 'Net return fell from '+METRICS[0].f(a)+' to '+METRICS[0].f(b)+'.';}},
        sharpe:{b:function(a,b){return 'Sharpe improved ('+a.toFixed(2)+' to '+b.toFixed(2)+'). Returns are steadier for the risk taken.';},w:function(a,b){return 'Sharpe dropped ('+a.toFixed(2)+' to '+b.toFixed(2)+'). Returns are less steady.';}},
        dd:{b:function(a,b){return 'Max drawdown shrank from '+a.toFixed(1)+'% to '+b.toFixed(1)+'%.';},w:function(a,b){return 'Max drawdown grew from '+a.toFixed(1)+'% to '+b.toFixed(1)+'%.';}},
        win:{b:function(a,b){return 'Win rate climbed from '+a.toFixed(0)+'% to '+b.toFixed(0)+'%.';},w:function(a,b){return 'Win rate slipped from '+a.toFixed(0)+'% to '+b.toFixed(0)+'%.';}},
        pf:{b:function(a,b){return 'Profit factor improved ('+a.toFixed(2)+' to '+b.toFixed(2)+').';},w:function(a,b){return 'Profit factor weakened ('+a.toFixed(2)+' to '+b.toFixed(2)+').';}}
      };
      METRICS.forEach(function(m){
        var d=cur[m.k]-prev[m.k], good=m.up?d>=0:d<=0;
        (good?better:worse).push(TXT[m.k][good?'b':'w'](prev[m.k],cur[m.k]));
        if(!good)worse._keys=(worse._keys||[]).concat(m.k);
      });
      var nb=better.length;
      verdict=nb>=4?'Better than v'+(v-1):nb<=1?'Worse than v'+(v-1):'Mixed vs v'+(v-1);
      vcls=nb>=4?'good':nb<=1?'bad':'mixed';
      var wk=worse._keys||[];
      if(!wk.length) tip='Every metric improved. Keep this version as a reference before changing more.';
      else if(wk.indexOf('dd')>-1) tip='Drawdown is the weak spot. A tighter stop loss or a smaller position size usually helps.';
      else if(wk.indexOf('win')>-1) tip='Entries may be too early. Try a confirming indicator or a longer timeframe.';
      else if(wk.indexOf('sharpe')>-1) tip='Returns are noisier. A volatility filter such as ATR can smooth them.';
      else tip='Gains are thinner. Check the take profit level against the stop loss.';
      html+='';
      bl=better.length?'<ul>'+better.map(function(t){return '<li><span>'+esc(t)+'</span></li>';}).join('')+'</ul>':'<p class="none">Nothing improved.</p>';
      wl=worse.length?'<ul>'+worse.map(function(t){return '<li><span>'+esc(t)+'</span></li>';}).join('')+'</ul>':'<p class="none">Nothing got worse.</p>';
    }
    var vEl=$('#verdict'); vEl.textContent=verdict; vEl.className='pill '+vcls;

    html+='<div class="assess"><h3>AI assessment</h3>';
    html+='<p class="comment"><b>'+(prev?'Change: ':'Start: ')+'</b>'+esc(cur.reason)+'. '+(prev?(better.length+' of 5 metrics improved. '):'')+esc(tip)+'</p>';
    if(prev){
      html+='<div class="cmp"><div class="b"><h4>BETTER</h4>'+bl+'</div><div class="w"><h4>WORSE</h4>'+wl+'</div></div>';
    }
    html+='<h3 style="margin-top:4px">Insights</h3><p class="sub-note">Patterns the assistant found in this 12-month sample. Demo text, regenerated on every run.</p>';
    html+='<ul class="ins">'+cur.insights.map(function(i){
      return '<li class="'+(i.neg?'neg':'')+'"><span class="tg">'+esc(i.tag)+'</span><span class="tt">'+esc(i.title)+'</span><span class="dt">'+esc(i.detail)+'</span><span class="ed">'+esc(i.edge)+'</span></li>';
    }).join('')+'</ul>';
    html+='</div>';

    var hv=versions.slice(-8), maxAbs=Math.max.apply(null,hv.map(function(r){return Math.abs(r.ret);}))||1;
    html+='<div><div class="kicker" style="margin-bottom:6px">Net return by version</div><div class="hist" role="img" aria-label="Net return for the last '+hv.length+' versions">';
    hv.forEach(function(r,i){
      var num=versions.length-hv.length+i+1, h=Math.max(3,Math.abs(r.ret)/maxAbs*46);
      html+='<div class="'+(num===v?'cur':'')+'"><div class="bar'+(r.ret<0?' neg':'')+'" style="height:'+h.toFixed(0)+'px;flex:none"></div><small>v'+num+'</small></div>';
    });
    html+='</div></div>';

    $('#resBody').innerHTML=html;
  }

  function assessZones(){
    ZONES.forEach(function(z){
      var n=active[z.id].length;
      scores[z.id]=n?Math.min(97,Math.round(rnd(48,84)+n*3)):0;
    });
  }
  function runBacktest(){
    assessZones();
    versions.push(makeResult());
    renderStrategy();
    renderResults();
    resultsEl.classList.remove('busy');
  }
  function changed(why){
    reason=why;
    resultsEl.classList.add('busy');
    clearTimeout(pending);
    pending=setTimeout(runBacktest,600);
  }

  /* ---------- Events ---------- */
  function deleteTile(t){
    var z=t.getAttribute('data-z'),id=t.getAttribute('data-id'),p=find(z,id);
    if(!p)return;
    var was=active[z].indexOf(id)>-1;
    PRESETS[z]=PRESETS[z].filter(function(x){return x.id!==id;});
    active[z]=active[z].filter(function(x){return x!==id;});
    delete values[id];
    renderPresets();renderStrategy();
    if(was)changed('Deleted '+p.name);
    toast('Deleted "'+p.name+'".');
  }
  function infoPopId(btn){
    return btn.hasAttribute('data-tile-info')?'tile-pop-'+btn.getAttribute('data-tile-info'):'pop-'+btn.getAttribute('data-info');
  }
  function closeInfoPops(except){
    Array.prototype.forEach.call(document.querySelectorAll('.info[aria-expanded="true"]'),function(b){
      if(b===except)return;
      b.setAttribute('aria-expanded','false');
      var p=document.getElementById(infoPopId(b));
      if(p)p.hidden=true;
    });
  }
  function toggleInfo(btn){
    var open=btn.getAttribute('aria-expanded')==='true';
    closeInfoPops(btn);
    var p=document.getElementById(infoPopId(btn));
    if(p)p.hidden=open;
    btn.setAttribute('aria-expanded',open?'false':'true');
    if(p&&!open&&btn.hasAttribute('data-tile-info')){
      var r=btn.getBoundingClientRect(),w=p.offsetWidth||230,h=p.offsetHeight||60;
      var left=Math.max(8,Math.min(r.right-w,window.innerWidth-w-8));
      var top=r.top-h-8; if(top<8)top=r.bottom+8;
      p.style.left=left+'px';p.style.top=top+'px';
    }
  }
  grid.addEventListener('click',function(e){
    var info=e.target.closest('.info');
    if(info){toggleInfo(info);return;}
    var del=e.target.closest('.del');
    if(del){deleteTile(del.closest('.tile'));return;}
    var add=e.target.closest('[data-add]');
    if(add){openModal(add.getAttribute('data-add'),add);return;}
    closeInfoPops(null);
  });
  resultsEl.addEventListener('click',function(e){
    var btn=e.target.closest('.info');
    if(!btn){closeInfoPops(null);return;}
    toggleInfo(btn);
  });
  document.addEventListener('keydown',function(e){if(e.key==='Escape')closeInfoPops(null);});

  function moveTile(z,id,to){
    var p=find(z,id),i=active[z].indexOf(id);
    if(to==='strategy'&&i<0){active[z].push(id);changed('Added '+p.name);}
    else if(to==='presets'&&i>-1){active[z].splice(i,1);changed('Removed '+p.name);}
    else return false;
    renderPresets();renderStrategy();
    return true;
  }
  function toggleTile(t,refocus){
    var z=t.getAttribute('data-z'),id=t.getAttribute('data-id');
    moveTile(z,id,active[z].indexOf(id)>-1?'presets':'strategy');
    if(refocus){var n=$('.tile[data-id="'+id+'"]');if(n)n.focus();}
  }
  grid.addEventListener('keydown',function(e){
    var t=e.target.closest&&e.target.closest('.tile');
    if(!t||e.target!==t)return;
    if(e.key==='Enter'||e.key===' '){e.preventDefault();toggleTile(t,true);}
    else if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();deleteTile(t);}
  });

  var drag=null;
  function boxes(){return grid.querySelectorAll('[data-drop]');}
  function clearMarks(){Array.prototype.forEach.call(boxes(),function(b){b.classList.remove('over','bad');});}
  function targetAt(x,y){var el=document.elementFromPoint(x,y);return el&&el.closest?el.closest('[data-drop]'):null;}
  grid.addEventListener('pointerdown',function(e){
    if(e.button>0)return;
    var t=e.target.closest('.tile');
    if(!t||e.target.closest('input,.del,.info,.info-pop'))return;
    drag={t:t,x:e.clientX,y:e.clientY,moved:false,ghost:null,id:e.pointerId,from:t.closest('[data-drop]').getAttribute('data-drop')};
  });
  document.addEventListener('pointermove',function(e){
    if(!drag||e.pointerId!==drag.id)return;
    if(!drag.moved){
      if(Math.abs(e.clientX-drag.x)+Math.abs(e.clientY-drag.y)<8)return;
      drag.moved=true;
      var r=drag.t.getBoundingClientRect(), g=drag.t.cloneNode(true);
      g.className+=' ghost';g.removeAttribute('tabindex');
      g.style.width=r.width+'px';g.style.height=r.height+'px';
      Array.prototype.forEach.call(g.querySelectorAll('[id]'),function(n){n.removeAttribute('id');});
      document.body.appendChild(g);
      drag.ghost=g;drag.dx=drag.x-r.left;drag.dy=drag.y-r.top;
      drag.t.classList.add('dragging');document.body.classList.add('is-dragging');
    }
    drag.ghost.style.left=(e.clientX-drag.dx)+'px';
    drag.ghost.style.top=(e.clientY-drag.dy)+'px';
    clearMarks();
    var dz=targetAt(e.clientX,e.clientY);
    if(dz&&dz.getAttribute('data-drop')!==drag.from){
      dz.classList.add(dz.getAttribute('data-z')===drag.t.getAttribute('data-z')?'over':'bad');
    }
  });
  function endDrag(e,cancel){
    if(!drag||e.pointerId!==drag.id)return;
    var d=drag;drag=null;
    clearMarks();
    if(d.ghost)d.ghost.remove();
    document.body.classList.remove('is-dragging');
    d.t.classList.remove('dragging');
    if(!d.moved){if(!cancel)toggleTile(d.t,false);return;}
    if(cancel)return;
    var dz=targetAt(e.clientX,e.clientY);
    if(!dz)return;
    var z=d.t.getAttribute('data-z');
    if(dz.getAttribute('data-z')!==z){
      var own=ZONES.filter(function(x){return x.id===z;})[0];
      dz.classList.add('shake');setTimeout(function(){dz.classList.remove('shake');},400);
      toast('That tile belongs to '+own.name+'. Drop it in the '+own.name+' box.');
      return;
    }
    moveTile(z,d.t.getAttribute('data-id'),dz.getAttribute('data-drop'));
  }
  document.addEventListener('pointerup',function(e){endDrag(e,false);});
  document.addEventListener('pointercancel',function(e){endDrag(e,true);});

  grid.addEventListener('change',function(e){
    var inp=e.target.closest('[data-val]'); if(!inp)return;
    var id=inp.getAttribute('data-val'),n=parseFloat(inp.value);
    if(isNaN(n)||n<0){inp.value=values[id];return;}
    var p=null;ZONES.forEach(function(z){p=p||find(z.id,id);});
    values[id]=n; changed('Set '+p.name+' to '+n+(p.unit||''));
  });

  /* ---------- Modal ---------- */
  var overlay=$('#overlay'),modal=$('#modal'),mZone=null,mOpener=null;
  function openModal(zid,opener){
    var z=ZONES.filter(function(x){return x.id===zid;})[0];
    mZone=z;mOpener=opener;
    modal.className='modal '+z.cls;
    $('#mTitle').textContent='New '+z.noun;
    $('#mName').value='';$('#mDesc').value='';$('#mErr').textContent='';
    overlay.hidden=false;
    setTimeout(function(){$('#mName').focus();},0);
  }
  function closeModal(){overlay.hidden=true;if(mOpener)mOpener.focus();}
  $('#mCancel').addEventListener('click',closeModal);
  overlay.addEventListener('mousedown',function(e){if(e.target===overlay)closeModal();});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!overlay.hidden)closeModal();});
  modal.addEventListener('submit',function(e){
    e.preventDefault();
    var name=$('#mName').value.trim(),desc=$('#mDesc').value.trim();
    if(!name){$('#mErr').textContent='Give it a name so you can find it later.';$('#mName').focus();return;}
    customCount++;
    var id='c'+customCount;
    PRESETS[mZone.id].push({id:id,name:name,desc:desc||'No description yet. The assistant will treat it as a general rule.',custom:true});
    lastAdded=id;
    var zn=mZone.name;
    overlay.hidden=true;
    renderPresets();
    var added=$('.preset[data-id="'+id+'"]'); if(added)added.scrollIntoView({block:'nearest'});
    var add=$('[data-add="'+mZone.id+'"]'); if(add)add.focus();
    toast('Added "'+name+'" to '+zn+'. Drag it into the strategy box.');
  });
  var toastTimer;
  function toast(msg){
    var t=$('#toast');t.textContent=msg;t.hidden=false;
    clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.hidden=true;},3600);
  }

  /* ---------- Start ---------- */
  renderPresets();
  runBacktest();
})();
</script>

</body></html>
